# Hyperlinks in the top navigation bar.
#
# The `title` is the text shown in the navigation bar.
# The `url` is the relative URL (e.g., /about/) or absolute URL (e.g., https://example.com).
# The optional `children` key adds a sub-menu with `title` and `url` entries.

- title: "About"
  url: /about/
- title: "Publications"
  url: /publications/
